<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Dark base block color -->
    <linearGradient id="blockDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e2a4d" />
      <stop offset="100%" stop-color="#07192f" />
    </linearGradient>
    
    <!-- Top-right cyan/blue glossy highlight -->
    <linearGradient id="blockGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5ca9e6" />
      <stop offset="35%" stop-color="#246ca8" />
      <stop offset="100%" stop-color="#081d36" />
    </linearGradient>

    <!-- Mid reflection gradient -->
    <linearGradient id="blockMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b4777" />
      <stop offset="100%" stop-color="#071a30" />
    </linearGradient>
  </defs>

  <!-- Deep dark navy backdrop -->
  <rect width="100" height="100" rx="14" fill="#061324" />

  <!-- Clean crisp white inner card -->
  <rect x="17" y="17" width="66" height="66" rx="2" fill="#ffffff" />

  <!-- Matrix Pixel Grid of 'P' (7x7) -->
  <g transform="translate(30.5, 30.5)">
    <!-- Row 0 -->
    <rect x="0" y="0" width="4.6" height="4.6" rx="1.3" fill="url(#blockDark)" />
    <rect x="5.6" y="0" width="4.6" height="4.6" rx="1.3" fill="url(#blockDark)" />
    <rect x="11.2" y="0" width="4.6" height="4.6" rx="1.3" fill="url(#blockDark)" />
    <rect x="16.8" y="0" width="4.6" height="4.6" rx="1.3" fill="url(#blockDark)" />
    <rect x="22.4" y="0" width="4.6" height="4.6" rx="1.3" fill="url(#blockDark)" />
    <rect x="28.0" y="0" width="4.6" height="4.6" rx="1.3" fill="url(#blockGlow)" />

    <!-- Row 1 -->
    <rect x="0" y="5.6" width="4.6" height="4.6" rx="1.3" fill="url(#blockDark)" />
    <rect x="5.6" y="5.6" width="4.6" height="4.6" rx="1.3" fill="url(#blockDark)" />
    <rect x="28.0" y="5.6" width="4.6" height="4.6" rx="1.3" fill="url(#blockDark)" />
    <rect x="33.6" y="5.6" width="4.6" height="4.6" rx="1.3" fill="url(#blockGlow)" />

    <!-- Row 2 -->
    <rect x="0" y="11.2" width="4.6" height="4.6" rx="1.3" fill="url(#blockDark)" />
    <rect x="5.6" y="11.2" width="4.6" height="4.6" rx="1.3" fill="url(#blockMid)" />
    <rect x="28.0" y="11.2" width="4.6" height="4.6" rx="1.3" fill="url(#blockDark)" />
    <rect x="33.6" y="11.2" width="4.6" height="4.6" rx="1.3" fill="url(#blockDark)" />

    <!-- Row 3 -->
    <rect x="0" y="16.8" width="4.6" height="4.6" rx="1.3" fill="url(#blockDark)" />
    <rect x="5.6" y="16.8" width="4.6" height="4.6" rx="1.3" fill="url(#blockDark)" />
    <rect x="11.2" y="16.8" width="4.6" height="4.6" rx="1.3" fill="url(#blockMid)" />
    <rect x="16.8" y="16.8" width="4.6" height="4.6" rx="1.3" fill="url(#blockMid)" />
    <rect x="22.4" y="16.8" width="4.6" height="4.6" rx="1.3" fill="url(#blockMid)" />
    <rect x="28.0" y="16.8" width="4.6" height="4.6" rx="1.3" fill="url(#blockDark)" />
    <rect x="33.6" y="16.8" width="4.6" height="4.6" rx="1.3" fill="url(#blockDark)" />

    <!-- Row 4 -->
    <rect x="0" y="22.4" width="4.6" height="4.6" rx="1.3" fill="url(#blockDark)" />
    <rect x="5.6" y="22.4" width="4.6" height="4.6" rx="1.3" fill="url(#blockDark)" />
    <rect x="11.2" y="22.4" width="4.6" height="4.6" rx="1.3" fill="url(#blockDark)" />
    <rect x="16.8" y="22.4" width="4.6" height="4.6" rx="1.3" fill="url(#blockDark)" />
    <rect x="22.4" y="22.4" width="4.6" height="4.6" rx="1.3" fill="url(#blockDark)" />
    <rect x="28.0" y="22.4" width="4.6" height="4.6" rx="1.3" fill="url(#blockDark)" />

    <!-- Row 5 -->
    <rect x="0" y="28.0" width="4.6" height="4.6" rx="1.3" fill="url(#blockDark)" />
    <rect x="5.6" y="28.0" width="4.6" height="4.6" rx="1.3" fill="url(#blockDark)" />

    <!-- Row 6 -->
    <rect x="0" y="33.6" width="4.6" height="4.6" rx="1.3" fill="url(#blockDark)" />
    <rect x="5.6" y="33.6" width="4.6" height="4.6" rx="1.3" fill="url(#blockDark)" />
  </g>
</svg>
